<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>

  <text x="190" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Mô hình OSI (7 lớp)</text>
  <text x="570" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Mô hình TCP/IP (5 lớp)</text>

  <!-- OSI layers -->
  <g font-size="14" fill="#ffffff">
    <rect x="70" y="50" width="240" height="50" fill="#2c5f8a"/>
    <text x="190" y="80" text-anchor="middle">7 — Application</text>

    <rect x="70" y="105" width="240" height="50" fill="#3a729f"/>
    <text x="190" y="135" text-anchor="middle">6 — Presentation</text>

    <rect x="70" y="160" width="240" height="50" fill="#4885b0"/>
    <text x="190" y="190" text-anchor="middle">5 — Session</text>

    <rect x="70" y="215" width="240" height="50" fill="#5c9b3f"/>
    <text x="190" y="245" text-anchor="middle">4 — Transport</text>

    <rect x="70" y="270" width="240" height="50" fill="#c98a2b"/>
    <text x="190" y="300" text-anchor="middle">3 — Network</text>

    <rect x="70" y="325" width="240" height="50" fill="#b0472f"/>
    <text x="190" y="355" text-anchor="middle">2 — Data Link</text>

    <rect x="70" y="380" width="240" height="50" fill="#6b3fa0"/>
    <text x="190" y="410" text-anchor="middle">1 — Physical</text>
  </g>

  <!-- TCP/IP layers -->
  <g font-size="14" fill="#ffffff">
    <rect x="450" y="50" width="240" height="105" fill="#2c5f8a"/>
    <text x="570" y="90" text-anchor="middle">5 — Application</text>
    <text x="570" y="110" font-size="11" fill="#dbe8f2" text-anchor="middle">(gộp App + Presentation + Session)</text>

    <rect x="450" y="215" width="240" height="50" fill="#5c9b3f"/>
    <text x="570" y="245" text-anchor="middle">4 — Transport</text>

    <rect x="450" y="270" width="240" height="50" fill="#c98a2b"/>
    <text x="570" y="300" text-anchor="middle">3 — Internet</text>

    <rect x="450" y="325" width="240" height="105" fill="#b0472f"/>
    <text x="570" y="365" text-anchor="middle">2 — Local Network</text>
    <text x="570" y="385" font-size="11" fill="#f6dcd6" text-anchor="middle">(gộp Data Link + Physical)</text>
  </g>

  <!-- mapping lines -->
  <g stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="310" y1="75"  x2="450" y2="100"/>
    <line x1="310" y1="130" x2="450" y2="100"/>
    <line x1="310" y1="185" x2="450" y2="100"/>
    <line x1="310" y1="240" x2="450" y2="240"/>
    <line x1="310" y1="295" x2="450" y2="295"/>
    <line x1="310" y1="350" x2="450" y2="375"/>
    <line x1="310" y1="405" x2="450" y2="375"/>
  </g>

  <text x="380" y="470" font-size="12" fill="#555555" text-anchor="middle">TCP/IP là mô hình thực tế đang được dùng trên Internet ngày nay;</text>
  <text x="380" y="488" font-size="12" fill="#555555" text-anchor="middle">OSI vẫn được dùng để tư duy và trao đổi khái niệm giữa các kỹ sư mạng.</text>
</svg>
