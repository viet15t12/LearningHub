<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">Router ↔ Switch: Cáp Straight-Through</text>

  <!-- Router box -->
  <rect x="40" y="120" width="160" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="120" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">ROUTER</text>

  <!-- Switch box -->
  <rect x="560" y="120" width="160" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="640" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">SWITCH</text>

  <!-- Arrows -->
  <g font-size="15" font-weight="600">
    <line x1="220" y1="150" x2="540" y2="150" stroke="#b91c1c" stroke-width="4" marker-end="url(#arrowRed)"/>
    <text x="380" y="140" text-anchor="middle" fill="#b91c1c">Router TX (Pin 1-2)  →  Switch RX (Pin 1-2)</text>

    <line x1="540" y1="190" x2="220" y2="190" stroke="#15803d" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="380" y="215" text-anchor="middle" fill="#15803d">Switch TX (Pin 3,6)  →  Router RX (Pin 3,6)</text>
  </g>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <text x="380" y="280" text-anchor="middle" font-size="14" fill="#4b5563">Router giống PC: TX ở Pin 1-2, RX ở Pin 3,6</text>
  <text x="380" y="330" text-anchor="middle" font-size="13" fill="#6b7280">Vẫn sử dụng cáp Straight-Through vì hai thiết bị khác loại</text>
</svg>
