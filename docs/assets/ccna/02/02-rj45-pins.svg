<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="350" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Đầu Nối RJ-45 – 8 Chân (Pins)</text>

  <!-- connector body -->
  <rect x="220" y="80" width="260" height="180" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
  <rect x="250" y="60" width="200" height="30" rx="6" fill="#d1d5db" stroke="#374151" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-size="12" fill="#374151">Ngàm gài (clip)</text>

  <!-- 8 pins -->
  <g>
    <!-- pin colors alternating for realism -->
    <rect x="235" y="100" width="14" height="140" fill="#f97316"/>
    <rect x="255" y="100" width="14" height="140" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="275" y="100" width="14" height="140" fill="#22c55e"/>
    <rect x="295" y="100" width="14" height="140" fill="#3b82f6"/>
    <rect x="315" y="100" width="14" height="140" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="335" y="100" width="14" height="140" fill="#22c55e"/>
    <rect x="355" y="100" width="14" height="140" fill="#78350f"/>
    <rect x="375" y="100" width="14" height="140" fill="#ffffff" stroke="#9ca3af"/>
  </g>

  <!-- pin numbers -->
  <g font-size="15" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="242" y="255">1</text>
    <text x="262" y="255">2</text>
    <text x="282" y="255">3</text>
    <text x="302" y="255">4</text>
    <text x="322" y="255">5</text>
    <text x="342" y="255">6</text>
    <text x="362" y="255">7</text>
    <text x="382" y="255">8</text>
  </g>

  <!-- callouts -->
  <g font-size="14" fill="#1d4ed8" font-weight="600">
    <line x1="242" y1="100" x2="180" y2="300" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="120" y="315">Pin 1-2: TX (PC)</text>

    <line x1="282" y1="100" x2="520" y2="300" stroke="#f97316" stroke-width="1.5"/>
    <text x="470" y="315" fill="#c2410c">Pin 3, 6: RX (PC)</text>
  </g>

  <text x="350" y="335" text-anchor="middle" font-size="14" fill="#4b5563">Mỗi cáp Ethernet có đầu RJ-45 với 8 chân tiếp xúc</text>
</svg>
