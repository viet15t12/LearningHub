<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="776" height="256" rx="16" fill="#ffffff" stroke="#111111" stroke-width="3"/>

  <!-- PC -->
  <rect x="50" y="90" width="150" height="90" rx="6" fill="#f7f5fe" stroke="#6c4fd6" stroke-width="1.5"/>
  <text x="125" y="130" fill="#6c4fd6" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600">PC</text>
  <text x="125" y="150" fill="#555555" font-family="monospace" font-size="10" text-anchor="middle">Terminal</text>
  <text x="125" y="164" fill="#555555" font-family="monospace" font-size="10" text-anchor="middle">Emulator</text>

  <!-- DB9 connector -->
  <rect x="215" y="120" width="34" height="20" rx="3" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="232" y="150" fill="#555555" font-family="monospace" font-size="9" text-anchor="middle">DB9</text>

  <!-- USB alt label -->
  <text x="232" y="105" fill="#999999" font-family="monospace" font-size="9" text-anchor="middle">(hoặc USB)</text>

  <!-- Cable -->
  <path d="M249 130 H531" fill="none" stroke="#0e9488" stroke-width="2.5"/>
  <text x="390" y="118" fill="#0e9488" font-family="monospace" font-size="12" text-anchor="middle" font-weight="600">CÁP ROLLOVER (ROLLOVER CABLE)</text>

  <!-- RJ45 connector -->
  <rect x="531" y="120" width="34" height="20" rx="3" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
  <text x="548" y="150" fill="#555555" font-family="monospace" font-size="9" text-anchor="middle">RJ-45</text>

  <!-- Router/Switch -->
  <rect x="580" y="90" width="150" height="90" rx="6" fill="#f2fbfa" stroke="#0e9488" stroke-width="1.5"/>
  <text x="655" y="130" fill="#0e9488" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600">ROUTER</text>
  <text x="655" y="150" fill="#555555" font-family="monospace" font-size="10" text-anchor="middle">CONSOLE</text>
  <text x="655" y="164" fill="#555555" font-family="monospace" font-size="10" text-anchor="middle">PORT</text>

  <text x="390" y="215" fill="#555555" font-family="monospace" font-size="11" text-anchor="middle">Đầu DB9 Serial → RJ-45, hoặc đầu DB9 Serial → USB</text>
</svg>
