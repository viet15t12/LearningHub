<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">Switch ↔ Switch: Cáp Crossover</text>

  <!-- Switch A -->
  <rect x="40" y="140" width="160" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="120" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">SWITCH A</text>
  <text x="120" y="205" text-anchor="middle" font-size="12" fill="#166534">TX: Pin 3,6 · RX: Pin 1-2</text>

  <!-- Switch B -->
  <rect x="560" y="140" width="160" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="640" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">SWITCH B</text>
  <text x="640" y="205" text-anchor="middle" font-size="12" fill="#166534">TX: Pin 3,6 · RX: Pin 1-2</text>

  <!-- crossed lines -->
  <line x1="200" y1="160" x2="560" y2="220" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrowB)"/>
  <line x1="200" y1="220" x2="560" y2="160" stroke="#f97316" stroke-width="3.5" marker-end="url(#arrowO)"/>

  <text x="380" y="140" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="600">Pin 3,6 (A) → Pin 1-2 (B)</text>
  <text x="380" y="260" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="600">Pin 1-2 (A) → Pin 3,6 (B)</text>

  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- pin swap detail -->
  <rect x="230" y="300" width="300" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="380" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Hoán đổi chân trên 1 đầu cáp</text>
  <text x="380" y="348" text-anchor="middle" font-size="13" fill="#4b5563">Pin 1 → Pin 3   |   Pin 2 → Pin 6</text>
  <text x="380" y="368" text-anchor="middle" font-size="13" fill="#4b5563">Pin 3 → Pin 1   |   Pin 6 → Pin 2</text>
</svg>
